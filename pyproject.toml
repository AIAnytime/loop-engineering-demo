[project]
name = "loop-engineering-demo"
version = "0.1.0"
description = "Workshop demo: loop engineering for reliable AI agents (OpenRouter + Finnhub)"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
deck = ["python-pptx>=1.0", "graphviz>=0.20", "pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]
